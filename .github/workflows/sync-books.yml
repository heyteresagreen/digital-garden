# Daily reading data sync for the Reading page: books from Hardcover
# (src/site/_data/hardcover-books.json) and liked articles from Instapaper
# (src/site/_data/instapaper.json). Never touches notes. See "Reading page
# data" in README.md.
name: Sync reading data

on:
  schedule:
    - cron: "0 21 * * *" # daily 21:00 UTC = 5am Perth, before the Mac's 7am Obsidian sync
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Hardcover is PAUSED (Oct 2026): src/site/_data/hardcover-books.json
      # keeps its last data, and book notes' own status/dates win over it.
      # To restart, put back this step:
      #   - name: Sync books from Hardcover
      #     run: node scripts/sync-hardcover.mjs
      #     env:
      #       HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}

      # Public profile data, no secret needed.
      - name: Sync liked articles from Instapaper
        if: ${{ !cancelled() }}
        run: node scripts/sync-instapaper.mjs

      - name: Commit if the reading data changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add src/site/_data/hardcover-books.json src/site/_data/instapaper.json
          git diff --staged --quiet && exit 0
          git commit -m "Sync reading data"
          # main may have moved since checkout (an Enveloppe publish during the
          # run, or a re-run, which replays the original commit), so put this
          # commit on top of the latest main. Only these two data files are
          # touched here, so the rebase can't conflict with notes.
          git pull --rebase origin main
          git push origin HEAD:main
